<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>夫妻共享记账本</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="theme-color" content="#1F6F50">
<style>
  :root{
    --bg:#FAF6EF; --card:#FFFFFF; --ink:#22302A; --muted:#7A877F;
    --accent:#1F6F50; --accent2:#2E8B66; --line:#EAE3D5;
    --shadow:0 2px 14px rgba(60,50,20,.07); --track:#F0EADD; --press:#F3EEE1;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141815; --card:#1F2620; --ink:#EDEBE4; --muted:#9AA79D; --line:#333B33; --shadow:0 2px 14px rgba(0,0,0,.35); --track:#2B332C; --press:#293028; }
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans SC",sans-serif; padding:0 14px 48px; }
  .wrap{ max-width:520px; margin:0 auto; }
  header{ position:sticky; top:0; z-index:6; display:flex; align-items:center; justify-content:space-between; padding:14px 2px 10px; background:var(--bg); }
  header h1{ font-size:19px; font-weight:700; }
  .nav{ display:flex; align-items:center; gap:6px; }
  .nav button{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:17px; cursor:pointer; }
  .nav button:active{ background:var(--press); }
  .nav button:disabled{ opacity:.35; }
  .nav .ym{ font-size:15px; font-weight:600; min-width:92px; text-align:center; }
  .backnow{ display:none; margin:0 auto 12px; padding:6px 14px; border-radius:99px; border:1px solid var(--line); background:var(--card); color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; }
  .card{ background:var(--card); border-radius:18px; box-shadow:var(--shadow); padding:20px; margin-bottom:14px; }
  .card h2{ font-size:14px; font-weight:700; margin-bottom:6px; display:flex; align-items:baseline; justify-content:space-between; }
  .card h2 .hint{ color:var(--muted); font-weight:400; font-size:12px; }
  /* 主卡 */
  .hero{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-radius:20px; box-shadow:0 6px 22px rgba(31,111,80,.28); padding:22px 20px 18px; margin-bottom:14px; position:relative; overflow:hidden; }
  .hero::before{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.08); top:-110px; right:-60px; }
  .hero .total-label{ font-size:13px; opacity:.85; position:relative; }
  .hero .total{ font-size:42px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; margin:2px 0 14px; position:relative; }
  .hero .stats{ display:flex; gap:10px; position:relative; }
  .hero .stat{ flex:1; background:rgba(255,255,255,.14); border-radius:12px; padding:9px 10px; }
  .hero .stat .k{ font-size:11px; opacity:.85; }
  .hero .stat .v{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:1px; }
  .hero .prog{ margin-top:14px; position:relative; }
  .hero .prog .bar{ height:6px; border-radius:3px; background:rgba(255,255,255,.25); overflow:hidden; }
  .hero .prog .bar i{ display:block; height:100%; background:#fff; border-radius:3px; }
  .hero .prog .txt{ font-size:12px; opacity:.9; margin-top:6px; font-variant-numeric:tabular-nums; }
  .hero .cny-line{ font-size:12px; opacity:.9; margin-top:8px; font-variant-numeric:tabular-nums; position:relative; }
  /* 每日支出（日历） */
  .cal{ margin-top:10px; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .cal-wd{ display:grid; grid-template-columns:repeat(7,1fr); background:var(--track); }
  .cal-wd span{ text-align:center; font-size:12px; padding:6px 0; color:var(--muted); font-weight:600; }
  .cal-wd .sun{ color:#D2604F; }
  .cal-wd .sat{ color:#4E8FD9; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); }
  .cell{ background:var(--card); min-height:66px; padding:4px 5px 5px; display:flex; flex-direction:column; }
  .cell .dn{ font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; align-self:flex-start; text-align:center; padding:1px 4px; }
  .cell.sun .dn{ color:#D2604F; }
  .cell.sat .dn{ color:#4E8FD9; }
  .cell.out{ opacity:.35; }
  .cell.today .dn{ background:var(--accent); color:#fff; border-radius:6px; }
  .cell .amt{ margin-top:auto; font-size:11px; font-weight:700; color:#C9503F; text-align:right; font-variant-numeric:tabular-nums; }
  .cell .meter{ height:4px; border-radius:2px; background:var(--track); margin-top:3px; overflow:hidden; }
  .cell .meter i{ display:block; height:100%; background:var(--accent); border-radius:2px; }
  .cell.has{ cursor:pointer; }
  .cell.has:active{ background:var(--press); }
  @media (prefers-color-scheme: dark){ .cell .amt{ color:#E07A63; } }
  .trend-empty{ color:var(--muted); font-size:13px; text-align:center; padding:18px 0 8px; }
  /* 分类排行 */
  .cat-row{ display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:12px; cursor:pointer; margin:0 -8px; }
  .cat-row:active{ background:var(--press); }
  .cat-row.active{ background:var(--press); box-shadow:inset 0 0 0 1px var(--line); }
  .chip{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; }
  .cat-main{ flex:1; min-width:0; }
  .cat-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .cat-name{ font-size:14px; font-weight:600; }
  .cat-amt{ font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; flex:none; }
  .cat-bar{ height:5px; border-radius:3px; background:var(--track); overflow:hidden; margin-top:5px; }
  .cat-bar i{ display:block; height:100%; border-radius:3px; }
  .cat-pct{ font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none; min-width:40px; text-align:right; }
  /* 流水 */
  .flow-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .flow-head h2{ margin-bottom:0; }
  .fchip{ display:none; align-items:center; gap:6px; padding:5px 8px 5px 12px; border-radius:99px; background:var(--accent); color:#fff; font-size:12px; font-weight:600; cursor:pointer; border:none; }
  .fchip b{ font-size:14px; line-height:1; }
  .day-group{ border-radius:12px; }
  .day-group.flash{ animation:flash 1.4s ease; }
  @keyframes flash{ 0%,60%{ background:rgba(31,111,80,.13); } 100%{ background:transparent; } }
  .day-head{ display:flex; align-items:baseline; justify-content:space-between; margin:16px 2px 4px; }
  .day-group:first-child .day-head{ margin-top:6px; }
  .day-title{ font-size:13px; color:var(--muted); font-weight:600; }
  .day-sum{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .entry{ display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-bottom:1px solid var(--line); }
  .day-group .entry:last-child{ border-bottom:none; }
  .entry .chip{ margin-top:1px; }
  .entry .meta{ flex:1; min-width:0; }
  .entry .item{ font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry .cat{ font-size:11px; color:var(--muted); margin-top:1px; }
  .entry .note{ font-size:12px; color:var(--muted); margin-top:3px; line-height:1.55; }
  .entry .amt{ font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; flex:none; }
  .empty{ text-align:center; color:var(--muted); padding:30px 10px; font-size:14px; line-height:1.7; }
  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧾 夫妻共享记账本</h1>
    <div class="nav">
      <button id="prev" aria-label="上个月">‹</button>
      <div class="ym" id="ym"></div>
      <button id="next" aria-label="下个月">›</button>
    </div>
  </header>
  <button class="backnow" id="backnow">回到本月</button>

  <div class="hero">
    <div class="total-label" id="totalLabel">本月总支出</div>
    <div class="total" id="total">¥0</div>
    <div class="stats">
      <div class="stat"><div class="k" id="stat1k">今日支出</div><div class="v" id="stat1">¥0</div></div>
      <div class="stat"><div class="k">日均支出</div><div class="v" id="stat2">¥0</div></div>
      <div class="stat"><div class="k">本月笔数</div><div class="v" id="stat3">0 笔</div></div>
    </div>
    <div class="prog" id="prog" style="display:none">
      <div class="bar"><i id="progBar"></i></div>
      <div class="txt" id="progTxt"></div>
    </div>
    <div class="cny-line" id="cnyLine" style="display:none"></div>
  </div>

  <div class="card">
    <h2>每日支出<span class="hint">点有金额的一天，跳到明细</span></h2>
    <div id="trend"></div>
  </div>

  <div class="card">
    <h2>分类排行<span class="hint">点分类，只看这一类</span></h2>
    <div id="cats"></div>
  </div>

  <div class="card">
    <div class="flow-head">
      <h2>明细</h2>
      <button class="fchip" id="fchip"><span id="fchipTxt"></span><b>✕</b></button>
    </div>
    <div id="flow"></div>
  </div>
  <footer id="updated"></footer>
</div>

<script>
const COLORS = {
  "食材买菜":"#43A673","外食":"#F08A3C","饮料零食":"#E3B341","交通":"#4E8FD9",
  "日用家用":"#8FBF6B","居住固定费":"#71809A","衣物美容":"#E77FA2","医疗健康":"#DE6159",
  "学习教育":"#9466D8","娱乐休闲":"#2BB3A3","交际人情":"#C98A5E","其他":"#9AA3AD"
};
const ICONS = {
  "食材买菜":"🥬","外食":"🍜","饮料零食":"☕","交通":"🚃",
  "日用家用":"🧺","居住固定费":"🏠","衣物美容":"👕","医疗健康":"💊",
  "学习教育":"📚","娱乐休闲":"🎮","交际人情":"🎁","其他":"📦"
};
const WD = ["周日","周一","周二","周三","周四","周五","周六"];
const fmt = n => "¥" + Math.round(n).toLocaleString("ja-JP");
let entries = [], viewYM = null, filterCat = null, lastHash = "";

function ymOf(d){ return d.slice(0,7); }
function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(){ const t=new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()); }
function curYM(){ const t=new Date(); return t.getFullYear()+"-"+pad(t.getMonth()+1); }
function daysIn(y, m){ return new Date(y, m, 0).getDate(); }
function dayLabel(ds){
  const t = todayStr();
  const y = new Date(Date.now()-864e5), ys = y.getFullYear()+"-"+pad(y.getMonth()+1)+"-"+pad(y.getDate());
  const d = new Date(ds+"T00:00:00");
  const base = (d.getMonth()+1)+"月"+d.getDate()+"日 "+WD[d.getDay()];
  if(ds===t) return "今天 · "+base;
  if(ds===ys) return "昨天 · "+base;
  return base;
}
function shiftYM(ym, delta){ const [y,m]=ym.split("-").map(Number); const d=new Date(y, m-1+delta, 1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function chip(cat, size){
  const c = COLORS[cat]||"#9AA3AD";
  return '<span class="chip" style="background:'+c+'22;'+(size?'width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.47)+'px;':'')+'">'+(ICONS[cat]||"📦")+'</span>';
}

function render(){
  const [vy, vm] = viewYM.split("-").map(Number);
  document.getElementById("ym").textContent = vy+"年"+vm+"月";
  document.getElementById("next").disabled = viewYM >= curYM();
  document.getElementById("backnow").style.display = viewYM === curYM() ? "none" : "block";
  const isCur = viewYM === curYM();
  const month = entries.filter(e => ymOf(e.date)===viewYM);
  const jpy = month.filter(e => e.currency==="JPY");
  const cny = month.filter(e => e.currency==="CNY");
  const total = jpy.reduce((s,e)=>s+e.amount,0);
  const cnyTotal = cny.reduce((s,e)=>s+e.amount,0);
  const dim = daysIn(vy, vm);
  const elapsed = isCur ? new Date().getDate() : dim;

  const perDay = {};
  jpy.forEach(e => { const d = Number(e.date.slice(8,10)); perDay[d] = (perDay[d]||0) + e.amount; });
  const maxDay = Math.max(0, ...Object.values(perDay));

  // 主卡
  document.getElementById("totalLabel").textContent = isCur ? "本月总支出" : vm+"月总支出";
  document.getElementById("total").textContent = fmt(total);
  const s1k = document.getElementById("stat1k"), s1 = document.getElementById("stat1");
  if(isCur){ s1k.textContent = "今日支出"; s1.textContent = fmt(entries.filter(e=>e.date===todayStr() && e.currency==="JPY").reduce((s,e)=>s+e.amount,0)); }
  else { s1k.textContent = "最高单日"; s1.textContent = fmt(maxDay); }
  document.getElementById("stat2").textContent = fmt(elapsed ? total/elapsed : 0);
  document.getElementById("stat3").textContent = month.length + " 笔";
  const prog = document.getElementById("prog");
  if(isCur && total>0){
    prog.style.display = "block";
    document.getElementById("progBar").style.width = (elapsed/dim*100).toFixed(1)+"%";
    document.getElementById("progTxt").textContent = vm+"月已过 "+elapsed+"/"+dim+" 天 · 按当前日均，全月预计 "+fmt(total/elapsed*dim);
  } else { prog.style.display = "none"; }
  const cl = document.getElementById("cnyLine");
  if(cnyTotal>0){ cl.style.display="block"; cl.textContent = "另有人民币支出 " + cnyTotal.toLocaleString("ja-JP") + " 元（分开统计，不并入上面）"; } else { cl.style.display="none"; }

  // 每日支出（日历，可点跳明细）
  const trend = document.getElementById("trend");
  const firstDow = new Date(vy, vm-1, 1).getDay();
  const prevDim = daysIn(vy, vm-1);
  const weeks = Math.ceil((firstDow + dim) / 7);
  let cells = "";
  for(let i=0; i<weeks*7; i++){
    const dn = i - firstDow + 1;
    const col = i % 7;
    const cls = (col===0 ? " sun" : col===6 ? " sat" : "");
    if(dn < 1){
      cells += '<div class="cell out'+cls+'"><span class="dn">'+(prevDim+dn)+'</span></div>';
    } else if(dn > dim){
      cells += '<div class="cell out'+cls+'"><span class="dn">'+(dn-dim)+'</span></div>';
    } else {
      const v = perDay[dn]||0;
      const ds = viewYM+"-"+pad(dn);
      const isToday = ds===todayStr();
      cells += '<div class="cell'+cls+(isToday?' today':'')+(v>0?' has':'')+'"'+(v>0?' data-date="'+ds+'"':'')+'><span class="dn">'+dn+'</span>'
        + (v>0 ? '<span class="amt">'+Math.round(v).toLocaleString("ja-JP")+'</span>' : '')
        + '<span class="meter"><i style="width:'+(maxDay>0 ? (v/maxDay*100).toFixed(1) : 0)+'%"></i></span></div>';
    }
  }
  trend.innerHTML = '<div class="cal"><div class="cal-wd"><span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span></div><div class="cal-grid">'+cells+'</div></div>';
  trend.querySelectorAll(".cell.has").forEach(c => c.addEventListener("click", () => jumpToDay(c.dataset.date)));

  // 分类排行（可点筛选）
  const byCat = {};
  jpy.forEach(e => { byCat[e.category] = (byCat[e.category]||0) + e.amount; });
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const catsEl = document.getElementById("cats");
  catsEl.innerHTML = cats.length
    ? cats.map(([c,v]) =>
        '<div class="cat-row'+(filterCat===c?' active':'')+'" data-cat="'+c+'">'+chip(c)+
        '<div class="cat-main"><div class="cat-top"><span class="cat-name">'+c+'</span><span class="cat-amt">'+fmt(v)+'</span></div>'+
        '<div class="cat-bar"><i style="width:'+(v/maxCat*100).toFixed(1)+'%;background:'+(COLORS[c]||"#9AA3AD")+'"></i></div></div>'+
        '<span class="cat-pct">'+(v/total*100).toFixed(1)+'%</span></div>').join("")
    : '<div class="empty">暂无记录</div>';
  catsEl.querySelectorAll(".cat-row").forEach(r => r.addEventListener("click", () => {
    filterCat = filterCat === r.dataset.cat ? null : r.dataset.cat;
    render();
  }));

  // 筛选徽标
  const fchip = document.getElementById("fchip");
  if(filterCat){ fchip.style.display = "inline-flex"; document.getElementById("fchipTxt").textContent = "只看：" + filterCat; }
  else { fchip.style.display = "none"; }

  // 流水（按筛选）
  const flow = document.getElementById("flow");
  const shown = filterCat ? month.filter(e => e.category===filterCat) : month;
  if(!month.length){ flow.innerHTML = '<div class="empty">账本还是空的<br>跟各自的 Muse 说一句消费，就记上了</div>'; return; }
  if(!shown.length){ flow.innerHTML = '<div class="empty">这个月没有「'+filterCat+'」的记录</div>'; return; }
  const days = {};
  shown.forEach(e => { (days[e.date] = days[e.date]||[]).push(e); });
  flow.innerHTML = Object.keys(days).sort().reverse().map(ds => {
    const list = days[ds];
    const dj = list.filter(e=>e.currency==="JPY").reduce((s,e)=>s+e.amount,0);
    const dc = list.filter(e=>e.currency==="CNY").reduce((s,e)=>s+e.amount,0);
    const sum = "小计 "+fmt(dj) + (dc>0 ? " · "+dc.toLocaleString("ja-JP")+" 元" : "");
    return '<div class="day-group" id="day-'+ds+'"><div class="day-head"><span class="day-title">'+dayLabel(ds)+'</span><span class="day-sum">'+sum+'</span></div>' +
      list.map(e => '<div class="entry">'+chip(e.category,38)+'<div class="meta"><div class="item">'+e.item+'</div><div class="cat">'+e.category+'</div>'+(e.note ? '<div class="note">'+e.note+'</div>' : '')+'</div><span class="amt">'+(e.currency==="CNY" ? e.amount.toLocaleString("ja-JP")+" 元" : fmt(e.amount))+'</span></div>').join("") + '</div>';
  }).join("");
}

function jumpToDay(ds){
  let el = document.getElementById("day-"+ds);
  if(!el && filterCat){ filterCat = null; render(); el = document.getElementById("day-"+ds); }
  if(!el) return;
  el.scrollIntoView({behavior:"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

async function load(){
  try{
    const r = await fetch("data.json?t=" + Date.now());
    const data = await r.json();
    const h = JSON.stringify(data.entries||[]) + "|" + (data.updatedAt||"");
    if(h === lastHash) return;
    lastHash = h;
    entries = data.entries || [];
    if(!viewYM) viewYM = curYM();
    document.getElementById("updated").textContent = data.updatedAt ? ("最后更新 " + data.updatedAt) : "";
    render();
  }catch(e){ /* 网络不通时保留上次画面 */ }
}
document.getElementById("prev").onclick = () => { viewYM = shiftYM(viewYM,-1); filterCat = null; render(); };
document.getElementById("next").onclick = () => { viewYM = shiftYM(viewYM, 1); filterCat = null; render(); };
document.getElementById("backnow").onclick = () => { viewYM = curYM(); filterCat = null; render(); };
document.getElementById("fchip").onclick = () => { filterCat = null; render(); };
load();
setInterval(load, 60000);
</script>
</body>
</html>
